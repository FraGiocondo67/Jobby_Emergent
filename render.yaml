# render.yaml definitivo per il backend JOBBY (FastAPI) — Blocco 7.
#
# Verificato in questo blocco: il server si avvia e risponde correttamente
# con le sole variabili Supabase impostate (SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, ADMIN_TOKEN) — nessuna MongoDB necessaria per il
# boot (vedi core.py: MONGO_CONFIGURED salta init/seed se MONGO_URL manca,
# client Mongo lazy quindi l'import non fallisce). Testato con
# `TestClient(server.app)` in questo ambiente: startup event e /openapi.json
# rispondono senza errori.
#
# AGGIORNAMENTO Blocco 7: gli 8 router Mongo-based rimasti (wallet.py,
# admin_web.py, admin_auth.py, payments_stripe.py, payments_services.py,
# payments_paypal.py, catalog_routes.py, dashboard.py) sono stati RITIRATI
# su conferma esplicita dell'utente — non più importati/esposti da
# server.py, stesso trattamento già dato a missions.py/bookings.py nel
# Blocco 5. `admin_web`/`admin_auth` saranno sostituiti da Retool (Blocco 6,
# in corso lato utente). Restano nel repo come riferimento storico.
#
# Come usarlo:
#   1. Su dashboard.render.com: New > Blueprint > collega il repo GitHub
#      `Jobby_Emergent` (branch main) > Render legge questo file (deve stare
#      nella ROOT del repo, non in backend/) e propone il servizio.
#   2. Le variabili d'ambiente NON vanno mai committate: vanno inserite a
#      mano nel pannello Render (Environment) dopo la creazione del servizio
#      — valori reali forniti dall'utente, mai in questo file.
#   3. Dopo il primo deploy riuscito, verificare GET /openapi.json e un
#      endpoint pubblico (es. GET /api/geocode con query) per conferma.

services:
  - type: web
    name: jobby-backend
    runtime: python
    region: frankfurt          # vicino a eu-west-1 (Supabase JOBBY) per ridurre la latenza
    plan: starter               # always-on (il piano Free si "addormenta" dopo inattività)
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    branch: main                 # verificare sempre che sia il branch giusto prima del primo deploy
    envVars:
      # --- Versione Python (aggiunta dopo il primo deploy fallito su Render) ---
      # Senza questa, Render usava di default Python 3.14 (bleeding edge), per
      # cui google-api-core/grpcio-status andavano in conflitto irrisolvibile
      # — quelle dipendenze (mai usate da nessun modulo, residuo Emergent) sono
      # state rimosse da requirements.txt, ma è comunque più sicuro fissare la
      # stessa versione verificata in sviluppo.
      - key: PYTHON_VERSION
        value: 3.11.15

      # --- Supabase / Postgres (uniche OBBLIGATORIE per l'avvio, vedi core_pg.py) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # --- Admin (token statico letto da core.py, usato da confirm_delivery.py
      #     — admin_auth.py/admin_web.py sono stati RITIRATI nel Blocco 7,
      #     non serve più per il vecchio backoffice) ---
      - key: ADMIN_TOKEN
        sync: false

      # --- AI dispute (Blocco 4) — opzionale: senza, dispute_ai.py usa il fallback euristico ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL      # opzionale, default "claude-sonnet-5" nel codice
        sync: false

      # --- Pagamenti (SDK diretti) — Stripe obbligatoria per le 4 verticali + listino ---
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_CONNECT_SECRET_KEY
        sync: false

      # --- PayPal — solo se/quando si riattivano i router Mongo-based che lo usano ---
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_BASE
        sync: false

      # --- Mongo — OPZIONALE, non serve più per le route migrate (Blocco 1-6).
      #     Da impostare SOLO se si vuole tenere in vita i pochi router ancora
      #     Mongo-based (vedi nota sopra) puntandoli a un'istanza reale.
      #     Senza, il server parte comunque (vedi verifica in cima al file).
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false

# Rimosse rispetto alla bozza Blocco 0 (mai effettivamente usate nel codice —
# verificato con grep su tutti gli os.environ del backend in questo blocco):
#   SUPABASE_JWT_SECRET (l'auth usa db.auth.get_user(token) via client
#   Supabase service-role, non un secret JWT separato — vedi deps_pg.py),
#   RESEND_API_KEY, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN (mai importati/usati
#   in nessun router, erano solo ipotesi nella bozza iniziale).
# Rimosse rispetto all'originale Emergent (da NON riportare comunque):
#   EMERGENT_SESSION_URL, EMERGENT_LLM_KEY, EXPO_PACKAGER_*, EMERGENT_PUSH_KEY
